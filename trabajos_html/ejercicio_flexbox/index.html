<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio ejemplo flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="logo">Mi sitio</h1>
        <nav class="nav">
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Servicios</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="articulos">
            <article>Articulo 1</article>
            <article>Articulo 2</article>
            <article>Articulo 3</article>
            <article>Articulo 4</article>
        </section>

        <section class="cajas">
            <div class="box">A</div>
            <div class="box">B</div>
            <div class="box">C</div>
        </section>

        <footer class="footer">
            <p>&copy; 2026 Mi Sitio</p>
            <div class="social">
                <a href="#">Facebook</a>
                <a href="#">X</a>
            </div>
        </footer>
    </main>
</body>
</html>
