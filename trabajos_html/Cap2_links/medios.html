<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="TFT-8">
        <meta name="viewport" content="width=device-widht", initial-scale="1.0">
        <title> Medios y Enlaces</title>
    </head>
    <body>
        <h1>Ejemplo de Medios en HTML</h1>
        <h2>Imagen</h2>
        <img src="./assets/mario.png" alt="Super Mario Bros" width="200px">
        <h2>Video</h2>
        <video width="200px" controls>
            <source src="./assets/Super_Mario_Bros.mp4" type="video/mp4">
            Tu navegador no soporta videos HTML5.
        </video>
        <h2>Audio</h2>
        <audio controls>
            <source src="./assets/ringtones-super-mario-bros.mp3" type="audio/mpeg">
            Tu navegador no sporta el elemento de audio.
        </audio>
        <h2>Enlaces</h2>
        <p>
            <a href="https://google.com.ar">Ir a google (misma pestaña)</a>
        </p>
        <p>
            <a href="https://google.com.ar" target="_blank">Ir a google (pestaña nueva)</a>
        </p>
    </body>
</html>
