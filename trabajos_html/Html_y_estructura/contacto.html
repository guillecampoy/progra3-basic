<!DOCTYPE html>
<html>
    <head>
        <meta charset="UFT-8">
        <meta name="viewport" content="width=device-widht", initial-scale="1.0">
        <title>Contacto</title>
    </head>
    <body>
        <header>
            <h1>Esta es una página de contacto</h1>
            <nav>
                <a href="#">Inicio</a> |
                <a href="#">Nosotors</a> |
                <a href="#">Contacto</a>
            </nav>
        </header>
        <main>
            <section>
                <h2>Dejanos tu comentario</h2>
                <p>Completa el formulario para hacernos saber tu opinión</p>
                <form>
                    <label for="nombre">Nombre completo: </label><br>
                    <input type="text" id="nombre" name="nombre" required
                        title="Sólo letras, mínimo 3 caracteres"><br><br>
                    <label for="email">Email: </label><br>
                    <input type="email" id="email" name="email" required
                        title="Email válido"><br><br>
                    <label for="mensaje">Mensaje: </label><br>
                    <textarea id="mensaje" name="mensaje" required minlength="10", maxlength="300"></textarea><br>
                    <button type="submit">Enviar</button>
                </form>
            </section>
            <aside>
                <h3>Horarios de atención</h3>
                <p>Lunes a viernes de 9:30 a 18:00</p>
                <h3>Teléfono de contacto</h3>
                <p>+54 9 11 64736999</p>
            </aside>
        </main>
        <footer>
            <p>&copy; 2026 Todos los derechos reservados The Test Company</p>    
        </footer>
    </body>
</html>
